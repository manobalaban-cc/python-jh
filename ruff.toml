# Course-wide lint configuration. Each exercise folder has its own pyproject.toml
# with the same settings, so the exercises are self-contained projects too.

line-length = 100
target-version = "py312"

# Inherited from the previous version of the course: kept as-is so the datasets
# can be regenerated exactly, but not held to the course's style rules.
exclude = ["data/generate_*.py"]

[lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[lint.per-file-ignores]
# Stub files hand deliberately unfinished code to the student.
"**/tasks/*.py" = ["F821"]
"**/src/txlib/*.py" = ["F821"]

[format]
# Ruff 0.16+ also formats Python blocks inside Markdown. The chapters contain
# deliberately elided snippets (`...`, aligned comments, partial classes), so the
# prose is left alone; only real .py files are formatted.
exclude = ["**/*.md"]
